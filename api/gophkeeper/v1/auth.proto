syntax = "proto3";

package gophkeeper.v1;

option go_package = "github.com/Irongoshan-ux/gophkeeper/pkg/gophkeeper/v1;gophkeeperv1";

service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
}

message RegisterRequest {
  string login = 1;
  string password = 2;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  string user_id = 2;
}
